<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ Points Adjustments ⚡</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Montserrat:wght@600;800&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --neon-black: #050505;
            --neon-bg: #0d0d0d;
            --neon-green: #2ECC71;
            --neon-purple: #9B59B6;
            --neon-cyan: #00AEEF;
            --neon-text: #E0E0E0;
            --neon-border: #333333;
        }
        
        body { 
            font-family: 'Roboto', sans-serif; 
            padding: 30px; 
            background: var(--neon-black); 
            min-height: 100vh; 
            margin: 0; 
            color: var(--neon-text); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            line-height: 1.6; 
        }

        header { text-align: center; margin-bottom: 40px; width: 100%; }

        h1 { 
            font-family: 'Orbitron', sans-serif; 
            color: var(--neon-cyan); 
            text-shadow: 0 0 20px rgba(0, 174, 239, 0.8), 0 0 40px rgba(155, 89, 182, 0.4); 
            font-size: 3.2em; 
            letter-spacing: 4px; 
            margin: 0; 
            text-transform: uppercase; 
        }

        h1::after { 
            content: ''; 
            display: block; 
            width: 50%; 
            height: 3px; 
            background: linear-gradient(90deg, var(--neon-purple), var(--neon-cyan), var(--neon-purple)); 
            margin: 15px auto 0; 
            box-shadow: 0 0 15px var(--neon-cyan);
        }

        .container { 
            display: flex; 
            justify-content: center;
            width: 100%; 
            max-width: 700px;
        }

        .input-form { 
            width: 100%;
            padding: 40px; 
            border-radius: 15px; 
            background-color: var(--neon-bg); 
            border: 3px solid var(--neon-purple); 
            box-shadow: 0 0 25px rgba(155, 89, 182, 0.3), inset 0 0 15px rgba(0, 174, 239, 0.1); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }

        h2 { 
            font-family: 'Montserrat', sans-serif; 
            color: var(--neon-cyan); 
            margin-top: 0; 
            font-size: 1.6em; 
            text-transform: uppercase; 
            align-self: stretch; 
            text-align: center; 
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--neon-cyan);
        }
        
        label {
            align-self: flex-start;
            margin-bottom: 5px;
            font-size: 0.85em;
            font-weight: bold;
            color: var(--neon-purple);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input[type="text"], select { 
            font-family: 'Roboto', sans-serif; 
            padding: 15px; 
            margin-bottom: 20px; 
            border-radius: 8px; 
            font-size: 1.1em; 
            background-color: #000000; 
            color: white; 
            border: 2px solid var(--neon-cyan); 
            width: 100%; 
            box-sizing: border-box; 
            transition: all 0.3s ease;
            box-shadow: 0 0 5px rgba(0, 174, 239, 0.2);
        }

        input[type="text"]:focus, select:focus {
            border-color: var(--neon-purple);
            box-shadow: 0 0 15px rgba(155, 89, 182, 0.6);
            outline: none;
            background-color: #0a0a0a;
        }

        /* DROPDOWN OPTIONS */
        #actionSelect option { background-color: #000; }
        #actionSelect option[value="Added"] { color: var(--neon-green); font-weight: bold; }
        #actionSelect option[value="Deducted"] { color: #E74C3C; font-weight: bold; }
        #actionSelect option[value="Balance Adjusted"] { color: var(--neon-purple); font-weight: bold; }

        button { 
            font-family: 'Orbitron', sans-serif; 
            background: linear-gradient(45deg, var(--neon-cyan), var(--neon-purple)); 
            color: white; 
            padding: 18px 25px; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 1.2em; 
            font-weight: 700; 
            transition: all 0.4s; 
            text-transform: uppercase; 
            width: 100%; 
            margin-top: 10px;
            box-shadow: 0 0 15px rgba(0, 174, 239, 0.4);
        }

        button:hover {
            transform: scale(1.02);
            box-shadow: 0 0 25px rgba(155, 89, 182, 0.8);
            letter-spacing: 2px;
        }

        #discordStatus { 
            font-size: 1em; 
            font-weight: bold; 
            margin-top: 20px; 
            min-height: 24px; 
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 8px currentColor;
        }

        @media (max-width: 768px) {
            h1 { font-size: 2em; }
            .input-form { padding: 25px; }
            .container { padding: 0 15px; }
        }
    </style>
</head>
<body>
    <header><h1>Points Adjustments</h1></header>

    <div class="container">
        <div class="input-form">
            <h2>➕ Submit Adjustment</h2>
            
            <label>Player EOS ID</label>
            <input type="text" id="nameId" placeholder="Enter EOS ID...">
            
            <label>Action Type</label>
            <select id="actionSelect">
                <option value="" disabled selected>--- Select Action ---</option>
                <option value="Added">Added</option>
                <option value="Deducted">Deducted</option>
                <option value="Balance Adjusted">Balance Adjusted</option>
                <option value="Other Action">Other Action</option>
            </select>
            <input type="text" id="otherActionInput" placeholder="Specify Other Action..." style="display:none;">

            <label>Adjustment Amount</label>
            <input type="text" id="amountInput" placeholder="Enter number...">

            <label>Reason for adjustment</label>
            <select id="whatFor">
                <option value="" disabled selected>--- Select Reason ---</option>
                <option value="This months Legend (5k)">This months Legend (5k)</option>
                <option value="Discord Boost (1k points)">Discord boost (1k points)</option>
                <option value="Server Donation (1k points)">Server donation (1k points)</option>
                <option value="Mod Developer Donation (1k points)">Mod developer donation (1k points)</option>
                <option value="Mee6 Lvl 10 (2k points)">Mee6 Lvl 10 (2k points)</option>
                <option value="Mee6 Lvl 15 (3k points)">Mee6 Lvl 15 (3k points)</option>
                <option value="Mee6 Lvl 20 (4k points)">Mee6 Lvl 20 (4k points)</option>
                <option value="1st in Accessories Leaderboard (5k points)">1st in Accessories Leaderboard (5k points)</option>
                <option value="2nd in Accessories Leaderboard (3k points)">2nd in Accessories Leaderboard (3k points)</option>
                <option value="3rd in Accessories Leaderboard (1k points)">3rd in Accessories Leaderboard (1k points)</option>
                <option value="Completing the Feedback Survey (2.5k)">Completing the feedback survey (2.5k)</option>
                <option value="Bought in another player (1k)">Bought in another player (1k)</option>
                <option value="Shop Refund">Shop refund</option>
                <option value="Misc">Misc</option>
            </select>
            <input type="text" id="miscReasonInput" placeholder="Specify Misc Reason..." style="display:none;">
            
            <label>Player name and/or other details</label>
            <input type="text" id="noteInput" placeholder="Enter name or details...">

            <button id="addToListBtn">Sync to Discord</button>
            <div id="discordStatus"></div>
        </div>
    </div>

    <script>
        const DISCORD_WEBHOOK = "https://discord.com/api/webhooks/1459631306999599229/iupMtQCVAOzQs7bdOshKoj5lKChcB9RHACgJjzDbSe137DUrvzFdfnm2pLpcokiSpKKi?thread_id=1460580121894191186";

        async function sendToDiscord(e) {
            let colorVal = 3447003; // Cyan Default
            if (e.actionClass === 'added') colorVal = 3066993; // Green
            if (e.actionClass === 'deducted') colorVal = 15158332; // Red
            if (e.actionClass === 'adjusted') colorVal = 10181046; // Purple

            const log = {
                embeds: [{
                    title: "Points Adjustment Log",
                    color: colorVal,
                    fields: [
                        { name: "EOS ID", value: e.player, inline: true },
                        { name: "Action", value: e.action, inline: true },
                        { name: "Amount", value: e.amount, inline: true },
                        { name: "Reason", value: e.reason, inline: false },
                        { name: "Player Details", value: e.note || "N/A", inline: false }
                    ],
                    footer: { text: `System: Points Adjustments` },
                    timestamp: new Date()
                }]
            };

            try {
                const response = await fetch(DISCORD_WEBHOOK, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify(log) 
                });
                if (response.ok) {
                    document.getElementById('discordStatus').style.color = "#2ECC71";
                    document.getElementById('discordStatus').textContent = "✅ ADJUSTMENT SYNCED";
                }
            } catch (err) { console.error(err); }
            setTimeout(() => { document.getElementById('discordStatus').textContent = ""; }, 4000);
        }

        document.getElementById('actionSelect').onchange = () => {
            document.getElementById('otherActionInput').style.display = document.getElementById('actionSelect').value === 'Other Action' ? 'block' : 'none';
        };
        document.getElementById('whatFor').onchange = () => {
            document.getElementById('miscReasonInput').style.display = document.getElementById('whatFor').value === 'Misc' ? 'block' : 'none';
        };

        document.getElementById('addToListBtn').onclick = async function() {
            const name = document.getElementById('nameId').value.trim();
            const amount = document.getElementById('amountInput').value.trim();
            const note = document.getElementById('noteInput').value.trim();
            let action = document.getElementById('actionSelect').value;
            let reason = document.getElementById('whatFor').value;

            if (!name || !action || !amount || !reason) return alert('Error: All required fields must be completed.');

            if (action === 'Other Action') action = "Other: " + document.getElementById('otherActionInput').value.trim();
            if (reason === 'Misc') reason = "Misc: " + document.getElementById('miscReasonInput').value.trim();

            let aClass = 'other';
            if (action.includes('Added')) aClass = 'added';
            else if (action.includes('Deducted')) aClass = 'deducted';
            else if (action.includes('Adjusted')) aClass = 'adjusted';

            const entry = { player: name, action, amount, reason, note, actionClass: aClass };

            document.getElementById('discordStatus').style.color = "#00AEEF";
            document.getElementById('discordStatus').textContent = "📡 UPLOADING...";
            
            await sendToDiscord(entry);
            
            // Reset fields
            document.getElementById('nameId').value = '';
            document.getElementById('amountInput').value = '';
            document.getElementById('noteInput').value = '';
            document.getElementById('actionSelect').selectedIndex = 0;
            document.getElementById('whatFor').selectedIndex = 0;
            document.getElementById('otherActionInput').style.display = 'none';
            document.getElementById('miscReasonInput').style.display = 'none';
        };
    </script>
</body>
</html>
