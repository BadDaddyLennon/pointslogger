<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ ArkLegendsPVE Sent Points Logs ⚡</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Montserrat:wght@600;800&display=swap" rel="stylesheet">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Montserrat:wght@600;800&display=swap');

        :root {
            --modern-darkest: #121212;
            --modern-dark-bg: #1e1e1e;
            --modern-accent-blue: #00AEEF;
            --modern-light-blue: #66CCFF;
            --modern-text-light: #E0E0E0;
            --modern-shadow-glow: rgba(0, 174, 239, 0.4);
            --modern-input-bg: #2b2b2b;
            --modern-border: #3A3A3A;
            --modern-secondary-text: #B0B0B0;
            --log-added-green: #2ECC71;
            --log-deducted-red: #E74C3C;
            --log-adjusted-blue: #3498DB;
            --log-added-color: var(--log-added-green);
            --log-deducted-color: var(--log-deducted-red);
            --log-adjusted-color: var(--log-adjusted-blue);
        }
        
        body { font-family: 'Roboto', sans-serif; padding: 30px; background: var(--modern-darkest); min-height: 100vh; margin: 0; color: var(--modern-text-light); display: flex; flex-direction: column; align-items: center; overflow-x: hidden; line-height: 1.6; }
        header { text-align: center; margin-bottom: 40px; width: 100%; }
        h1 { font-family: 'Montserrat', sans-serif; color: var(--modern-text-light); text-shadow: 0 0 15px var(--modern-shadow-glow); font-size: 3.5em; letter-spacing: 5px; margin: 0; text-transform: uppercase; }
        h1::after { content: ''; display: block; width: 100%; height: 3px; background: var(--modern-accent-blue); margin: 10px auto 0; border-radius: 2px; box-shadow: 0 0 10px var(--modern-shadow-glow); }
        
        .container { display: flex; flex-wrap: wrap; gap: 30px; max-width: 1400px; margin: 0 auto; width: 100%; }
        .input-form, .list-container { min-width: 350px; padding: 40px; border-radius: 8px; background-color: var(--modern-dark-bg); border: 1px solid var(--modern-border); box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5); box-sizing: border-box; display: flex; flex-direction: column; align-items: center; }
        .input-form { flex: 1; }
        .list-container { flex: 2; min-width: 700px; }
        h2 { font-family: 'Montserrat', sans-serif; color: var(--modern-accent-blue); border-bottom: 3px solid var(--modern-border); padding-bottom: 12px; margin-top: 0; font-size: 1.8em; text-transform: uppercase; align-self: stretch; text-align: center; }
        
        input[type="text"], select { font-family: 'Roboto', sans-serif; padding: 15px; margin: 12px 0; border-radius: 4px; font-size: 1.1em; background-color: var(--modern-input-bg); color: var(--modern-text-light); border: 1px solid var(--modern-accent-blue); width: 100%; box-sizing: border-box; }
        
        button { font-family: 'Montserrat', sans-serif; background: var(--modern-accent-blue); color: var(--modern-darkest); padding: 12px 25px; border: none; border-radius: 4px; cursor: pointer; font-size: 1.1em; font-weight: 700; transition: all 0.2s; text-transform: uppercase; width: 90%; margin-bottom: 5px; }
        .button-group { display: flex; flex-direction: column; width: 100%; margin-top: 30px; gap: 12px; align-items: center; }
        #addToListBtn { padding: 15px 35px; font-size: 1.3em; border: 2px solid var(--modern-text-light); }
        .danger-button { background: #E74C3C; color: white; }
        .info-button { background: #2C3E50; color: white; }

        #entryList { list-style: none; padding: 0; margin: 0; width: 100%; }
        #entryList li { background: var(--modern-input-bg); margin: 4px 0; padding: 10px; border-radius: 4px; border: 1px solid; font-size: 0.8em; display: flex; flex-direction: column; position: relative; padding-right: 40px; }
        .log-content { display: flex; flex-wrap: nowrap; width: 100%; align-items: center; }
        .log-segment { padding: 0 8px 0 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .log-segment strong { color: var(--modern-secondary-text); margin-right: 3px; }
        .log-segment-name { flex-basis: 220px; font-weight: 700; color: var(--modern-accent-blue); }
        .log-segment-action { flex-basis: 180px; }
        .log-segment-amount { flex-basis: 120px; font-weight: 900; }
        .log-segment-reason { flex-grow: 1; white-space: normal; }
        .log-segment-note { display: block; width: 100%; border-top: 1px dashed var(--modern-border); margin-top: 4px; padding-top: 4px; font-style: italic; }
        
        #entryList li.added { border-color: var(--log-added-green); }
        #entryList li.deducted { border-color: var(--log-deducted-red); }
        #entryList li.adjusted { border-color: var(--log-adjusted-blue); }
        #entryList li.added .log-segment-amount { color: var(--log-added-color); }
        #entryList li.deducted .log-segment-amount { color: var(--log-deducted-color); }
        
        .log-timestamp { font-size: 0.65em; color: #888; text-align: right; width: 100%; }
        .delete-btn { position: absolute; top: 10px; right: 10px; color: var(--log-deducted-red); background: none; border: none; font-size: 1.5em; cursor: pointer; opacity: 0.5; }
        .delete-btn:hover { opacity: 1; }
        #discordStatus { font-size: 0.9em; font-weight: bold; margin-top: 5px; min-height: 20px; }

        @media (max-width: 768px) { .log-content { flex-direction: column; align-items: flex-start; } .log-segment { width: 100%; white-space: normal; } }
    </style>
</head>
<body>
    <header><h1>ArkLegendsPVE Sent Points Logs</h1></header>

    <div class="container">
        <div class="input-form">
            <h2>➕ Add Points Log</h2>
            <input type="text" id="nameId" placeholder="Player Name/EOS ID">
            <select id="actionSelect">
                <option value="" disabled selected>--- Select Action Type ---</option>
                <option value="Added">Added</option>
                <option value="Deducted">Deducted</option>
                <option value="Balance Adjusted">Balance Adjusted</option>
                <option value="Other Action">Other Action</option>
            </select>
            <input type="text" id="otherActionInput" placeholder="Specify Other Action" style="display:none;">
            <input type="text" id="amountInput" placeholder="Amount (e.g., 5000)">
            <select id="whatFor">
                <option value="" disabled selected>--- Select Reason for Points ---</option>
                <option value="This months Legend (5k)">This months Legend (5k)</option>
                <option value="Discord Boost (1k points)">Discord boost (1k points)</option>
                <option value="Server Donation (1k points)">Server donation (1k points)</option>
                <option value="Mod Developer Donation (1k points)">Mod developer donation (1k points)</option>
                <option value="Mee6 Lvl 10 (2k points)">Mee6 Lvl 10 (2k points)</option>
                <option value="Mee6 Lvl 15 (3k points)">Mee6 Lvl 15 (3k points)</option>
                <option value="Mee6 Lvl 20 (4k points)">Mee6 Lvl 20 (4k points)</option>
                <option value="1st in Accessories Leaderboard (5k points)">1st in Accessories Leaderboard (5k points)</option>
                <option value="2nd in Accessories Leaderboard (3k points)">2nd in Accessories Leaderboard (3k points)</option>
                <option value="3rd in Accessories Leaderboard (1k points)">3rd in Accessories Leaderboard (1k points)</option>
                <option value="Completing the Feedback Survey (2.5k)">Completing the feedback survey (2.5k)</option>
                <option value="Bought in another player (1k)">Bought in another player (1k)</option>
                <option value="Shop Refund">Shop refund</option>
                <option value="Misc">Misc</option>
            </select>
            <input type="text" id="miscReasonInput" placeholder="Specify Misc Reason" style="display:none;">
            <input type="text" id="noteInput" placeholder="Optional: Add a note or comment">

            <div class="button-group">
                <button id="addToListBtn">Save to Log</button>
                <div id="discordStatus"></div>
                <button id="downloadLogBtn" class="info-button">Download Log (.txt)</button>
                <button id="clearLogBtn" class="danger-button">Clear ALL Entries</button>
            </div>
        </div>

        <div class="list-container">
            <h2>📜 Points History</h2> 
            <div style="display:flex; gap:10px; width:100%; margin-bottom:15px;">
                <input type="text" id="searchBar" placeholder="🔍 Search logs..." style="margin:0;">
                <button id="searchButton" style="width:100px; margin:0;">Search</button>
            </div>
            <ul id="entryList"></ul>
        </div>
    </div>

    <script>
        const BIN_ID = "69389022ae596e708f8e9cb0";
        const SECRET_KEY = "$2a$10$AGsAc/FGcGFFtSHsaLM9de17DA4gr8Tn/A1ZD6B1NkQHITT2Mb21y"; 
        const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;
        const DISCORD_WEBHOOK = "https://discord.com/api/webhooks/1459631306999599229/iupMtQCVAOzQs7bdOshKoj5lKChcB9RHACgJjzDbSe137DUrvzFdfnm2pLpcokiSpKKi?thread_id=1460580121894191186";

        let logEntries = [];

        async function sendToDiscord(entryData) {
            const timestamp = new Date().toLocaleString('en-GB');
            let icon = entryData.actionClass === 'added' ? "🟢" : (entryData.actionClass === 'deducted' ? "🔴" : "🔵");
            const boxMsg = "```\n" + icon + " ARKLEGENDS POINT UPDATE\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\nAction:  " + entryData.action + "\nPlayer:  " + entryData.player + "\nAmount:  " + entryData.amount + "\nReason:  " + entryData.reason + "\n" + (entryData.note ? "Note:    " + entryData.note + "\n" : "") + "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\nLogged:  " + timestamp + "\n```";
            try {
                const response = await fetch(DISCORD_WEBHOOK, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ content: boxMsg }) });
                if (response.ok) { document.getElementById('discordStatus').style.color = "#2ECC71"; document.getElementById('discordStatus').textContent = "✅ Sent to Discord"; }
            } catch (e) { console.error(e); }
            setTimeout(() => { document.getElementById('discordStatus').textContent = ""; }, 4000);
        }

        async function loadEntries() {
            try {
                const res = await fetch(API_URL, { headers: { 'X-Master-Key': SECRET_KEY } });
                const data = await res.json();
                logEntries = Array.isArray(data.record) ? data.record.filter(e => e && e.player) : [];
                renderEntries();
            } catch (error) { console.error(error); }
        }

        async function saveEntries() {
            try {
                await fetch(API_URL, { method: 'PUT', headers: { 'Content-Type': 'application/json', 'X-Master-Key': SECRET_KEY }, body: JSON.stringify(logEntries.length > 0 ? logEntries : [{text: "PLACEHOLDER"}]) });
            } catch (error) { alert("🚨 Server Error!"); }
        }

        async function deleteEntry(idx) {
            if (!confirm(`Delete this entry?`)) return;
            logEntries.splice(idx, 1);
            renderEntries();
            await saveEntries();
        }

        function renderEntries() {
            const list = document.getElementById('entryList');
            list.innerHTML = '';
            logEntries.slice().reverse().forEach((entry, index) => {
                const actualIdx = logEntries.length - 1 - index;
                const li = document.createElement('li');
                li.className = entry.actionClass || 'other';
                li.innerHTML = `<button class="delete-btn" onclick="deleteEntry(${actualIdx})">&times;</button>${entry.html}`;
                li.setAttribute('data-search', (entry.search || '').toLowerCase());
                list.appendChild(li);
            });
        }

        document.getElementById('actionSelect').onchange = () => {
            document.getElementById('otherActionInput').style.display = document.getElementById('actionSelect').value === 'Other Action' ? 'block' : 'none';
        };
        document.getElementById('whatFor').onchange = () => {
            document.getElementById('miscReasonInput').style.display = document.getElementById('whatFor').value === 'Misc' ? 'block' : 'none';
        };

        // FIXED SAVE LOGIC
        document.getElementById('addToListBtn').onclick = async function() {
            const nameField = document.getElementById('nameId');
            const amountField = document.getElementById('amountInput');
            const actionField = document.getElementById('actionSelect');
            const reasonField = document.getElementById('whatFor');
            const noteField = document.getElementById('noteInput');

            const name = nameField.value.trim();
            const amount = amountField.value.trim();
            const note = noteField.value.trim();
            let action = actionField.value;
            let reason = reasonField.value;

            if (!name || !action || !amount || !reason) {
                alert('Please fill in all fields!');
                return;
            }

            if (action === 'Other Action') {
                action = "Other Action: " + document.getElementById('otherActionInput').value.trim();
            }
            if (reason === 'Misc') {
                reason = "Misc: " + document.getElementById('miscReasonInput').value.trim();
            }

            const actionClass = action.toLowerCase().includes('added') ? 'added' : (action.toLowerCase().includes('deducted') ? 'deducted' : 'adjusted');
            const ts = new Date().toLocaleString('en-GB');

            const entryHtml = `<div class="log-content"><span class="log-segment log-segment-name"><strong>Player:</strong> ${name}</span><span class="log-segment log-segment-action"><strong>Action:</strong> ${action}</span><span class="log-segment log-segment-amount"><strong>Amount:</strong> ${amount}</span><span class="log-segment log-segment-reason"><strong>Reason:</strong> ${reason}</span></div>${note ? `<span class="log-segment log-segment-note"><strong>Note:</strong> ${note}</span>` : ''}<span class="log-timestamp">Logged: ${ts}</span>`;

            const entryData = { player: name, action, amount, reason, note, html: entryHtml, actionClass, search: `${name} ${action} ${amount} ${reason} ${note}`.toLowerCase() };

            logEntries.push(entryData);
            renderEntries();
            await saveEntries();
            
            document.getElementById('discordStatus').textContent = "📡 Syncing...";
            await sendToDiscord(entryData);
            
            // Clear inputs
            nameField.value = '';
            amountField.value = '';
            noteField.value = '';
            actionField.selectedIndex = 0;
            reasonField.selectedIndex = 0;
            document.getElementById('otherActionInput').style.display = 'none';
            document.getElementById('miscReasonInput').style.display = 'none';
        };

        document.getElementById('clearLogBtn').onclick = async function() {
            const pw = prompt("Enter password to clear ALL logs:");
            if (pw !== "legends") return alert("Wrong password.");
            logEntries = [];
            renderEntries();
            await saveEntries();
            alert("Logs cleared.");
        };

        document.getElementById('searchButton').onclick = () => {
            const q = document.getElementById('searchBar').value.toLowerCase();
            Array.from(document.getElementById('entryList').children).forEach(li => {
                const text = li.getAttribute('data-search') || "";
                li.style.display = text.includes(q) ? 'flex' : 'none';
            });
        };

        document.addEventListener('DOMContentLoaded', loadEntries);
    </script>
</body>
</html>
