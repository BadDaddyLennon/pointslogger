<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ ArkLegendsPVE Sent Points Logs ⚡</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Montserrat:wght@600;800&display=swap" rel="stylesheet">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Montserrat:wght@600;800&display=swap');

        :root {
            --modern-darkest: #121212;
            --modern-dark-bg: #1e1e1e;
            --modern-accent-blue: #00AEEF;
            --modern-light-blue: #66CCFF;
            --modern-text-light: #E0E0E0;
            --modern-shadow-glow: rgba(0, 174, 239, 0.4);
            --modern-input-bg: #2b2b2b;
            --modern-border: #3A3A3A;
            --modern-secondary-text: #B0B0B0;
            --log-added-green: #2ECC71; 
            --log-deducted-red: #E74C3C; 
            --log-adjusted-blue: #3498DB; 
        }
        
        body { font-family: 'Roboto', sans-serif; padding: 30px; background: var(--modern-darkest); min-height: 100vh; margin: 0; color: var(--modern-text-light); display: flex; flex-direction: column; align-items: center; overflow-x: hidden; line-height: 1.6; }
        header { text-align: center; margin-bottom: 40px; width: 100%; }
        h1 { font-family: 'Montserrat', sans-serif; color: var(--modern-text-light); text-shadow: 0 0 15px var(--modern-shadow-glow); font-size: 3.5em; letter-spacing: 5px; margin: 0; text-transform: uppercase; }
        h1::after { content: ''; display: block; width: 100%; height: 3px; background: var(--modern-accent-blue); margin: 10px auto 0; border-radius: 2px; box-shadow: 0 0 10px var(--modern-shadow-glow); }

        .container { display: flex; flex-wrap: wrap; gap: 30px; max-width: 1400px; margin: 0 auto; width: 100%; }
        .input-form, .list-container { min-width: 350px; padding: 40px; border-radius: 8px; background-color: var(--modern-dark-bg); border: 1px solid var(--modern-border); box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5); box-sizing: border-box; }
        .input-form { flex: 1; display: flex; flex-direction: column; align-items: center; }
        .list-container { flex: 2; min-width: 700px; }

        h2 { font-family: 'Montserrat', sans-serif; color: var(--modern-accent-blue); border-bottom: 3px solid var(--modern-border); padding-bottom: 12px; margin-top: 0; font-size: 1.8em; text-transform: uppercase; align-self: stretch; text-align: center; }
        
        input[type="text"], select { font-family: 'Roboto', sans-serif; padding: 15px; margin: 12px 0; border-radius: 4px; font-size: 1.1em; background-color: var(--modern-input-bg); color: var(--modern-text-light); border: 1px solid var(--modern-accent-blue); width: 100%; box-sizing: border-box; }

        #actionSelect option[value="Added"] { color: var(--log-added-green); font-weight: bold; }
        #actionSelect option[value="Deducted"] { color: var(--log-deducted-red); font-weight: bold; }
        #actionSelect option[value="Balance Adjusted"] { color: var(--log-adjusted-blue); font-weight: bold; }

        button { font-family: 'Montserrat', sans-serif; background: var(--modern-accent-blue); color: var(--modern-darkest); padding: 12px 25px; border: none; border-radius: 4px; cursor: pointer; font-size: 1.1em; font-weight: 700; transition: all 0.2s; text-transform: uppercase; width: 90%; }
        .button-group { display: flex; flex-direction: column; width: 100%; margin-top: 30px; gap: 12px; align-items: center; }
        #addToListBtn { padding: 15px 35px; font-size: 1.3em; border: 2px solid var(--modern-text-light); }
        .danger-button { background: #E74C3C; color: white; }
        .info-button { background: #2C3E50; color: white; }

        /* LIST STYLING */
        #entryList { list-style: none; padding: 0; margin: 0; width: 100%; }
        #entryList li { background: var(--modern-input-bg); margin: 6px 0; padding: 10px; border-radius: 6px; border: 1px solid; display: flex; flex-direction: column; position: relative; padding-right: 45px; }
        
        /* Desktop Log Row */
        .log-content { display: flex; flex-wrap: nowrap; width: 100%; align-items: center; font-size: 0.85em; }
        .log-segment { padding: 0 10px 0 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-shrink: 0; }
        .log-segment strong { color: var(--modern-secondary-text); margin-right: 4px; }
        .log-segment-name { flex-basis: 220px; font-weight: 700; color: var(--modern-accent-blue); }
        .log-segment-action { flex-basis: 160px; }
        .log-segment-amount { flex-basis: 110px; font-weight: 900; }
        .log-segment-reason { flex-grow: 1; white-space: normal; }
        .log-segment-note { display: block; width: 100%; border-top: 1px dashed var(--modern-border); margin-top: 6px; padding-top: 6px; font-style: italic; font-size: 0.85em; color: var(--modern-secondary-text); }

        #entryList li.added { border-color: var(--log-added-green); }
        #entryList li.deducted { border-color: var(--log-deducted-red); }
        #entryList li.adjusted { border-color: var(--log-adjusted-blue); }
        #entryList li.added .log-segment-amount { color: var(--log-added-green); }
        #entryList li.deducted .log-segment-amount { color: var(--log-deducted-red); }
        
        .log-timestamp { font-size: 0.7em; color: #888; text-align: right; width: 100%; margin-top: 4px; }
        .delete-btn { position: absolute; top: 10px; right: 10px; color: var(--log-deducted-red); background: none; border: none; font-size: 1.6em; cursor: pointer; opacity: 0.6; line-height: 1; }
        #discordStatus { font-size: 0.9em; font-weight: bold; margin-top: 5px; min-height: 20px; }

        .points-reference { margin-top: 30px; align-self: stretch; padding: 15px; background-color: #242424; border-radius: 4px; border: 1px dashed var(--modern-border); font-size: 0.9em; display: flex; flex-wrap: wrap; gap: 20px; }
        .reference-section { flex: 1; min-width: 250px; }
        .points-list-item { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px dashed #333; }
        .points-list-item strong { color: var(--modern-light-blue); }

        /* --- MOBILE SPECIFIC OVERRIDES --- */
        @media (max-width: 768px) {
            body { padding: 15px; }
            h1 { font-size: 2em; letter-spacing: 2px; }
            .container { gap: 15px; }
            .input-form, .list-container { padding: 20px; min-width: 100%; }
            
            .log-content { flex-direction: column; align-items: flex-start; font-size: 0.95em; gap: 4px; }
            .log-segment { white-space: normal; overflow: visible; padding: 0; width: 100%; }
            .log-segment-name, .log-segment-action, .log-segment-amount, .log-segment-reason { flex-basis: auto; width: 100%; }
            
            #entryList li { padding-right: 35px; margin: 10px 0; }
            .log-timestamp { text-align: left; margin-top: 8px; border-top: 1px solid #333; padding-top: 4px; }
            .delete-btn { font-size: 1.8em; top: 8px; right: 8px; }
        }
    </style>
</head>
<body>
    <header><h1>ArkLegendsPVE Sent Points Logs</h1></header>

    <div class="container">
        <div class="input-form">
            <h2>➕ Add Points Log</h2>
            <input type="text" id="nameId" placeholder="Player Name/EOS ID">
            <select id="actionSelect">
                <option value="" disabled selected>--- Select Action Type ---</option>
                <option value="Added">Added</option>
                <option value="Deducted">Deducted</option>
                <option value="Balance Adjusted">Balance Adjusted</option>
                <option value="Other Action">Other Action</option>
            </select>
            <input type="text" id="otherActionInput" placeholder="Specify Other Action" style="display:none;">
            <input type="text" id="amountInput" placeholder="Amount (e.g., 5000)">
            <select id="whatFor">
                <option value="" disabled selected>--- Select Reason ---</option>
                <option value="This months Legend (5k)">This months Legend (5k)</option>
                <option value="Discord Boost (1k points)">Discord boost (1k points)</option>
                <option value="Server Donation (1k points)">Server donation (1k points)</option>
                <option value="Mod Developer Donation (1k points)">Mod developer donation (1k points)</option>
                <option value="Mee6 Lvl 10 (2k points)">Mee6 Lvl 10 (2k points)</option>
                <option value="Mee6 Lvl 15 (3k points)">Mee6 Lvl 15 (3k points)</option>
                <option value="Mee6 Lvl 20 (4k points)">Mee6 Lvl 20 (4k points)</option>
                <option value="1st in Accessories Leaderboard (5k points)">1st in Accessories Leaderboard (5k points)</option>
                <option value="2nd in Accessories Leaderboard (3k points)">2nd in Accessories Leaderboard (3k points)</option>
                <option value="3rd in Accessories Leaderboard (1k points)">3rd in Accessories Leaderboard (1k points)</option>
                <option value="Completing the Feedback Survey (2.5k)">Completing the feedback survey (2.5k)</option>
                <option value="Bought in another player (1k)">Bought in another player (1k)</option>
                <option value="Shop Refund">Shop refund</option>
                <option value="Misc">Misc</option>
            </select>
            <input type="text" id="miscReasonInput" placeholder="Specify Misc Reason" style="display:none;">
            <input type="text" id="noteInput" placeholder="Optional Note">

            <div class="button-group">
                <button id="addToListBtn">Save to Log</button>
                <div id="discordStatus"></div>
                <button id="downloadLogBtn" class="info-button">Download Log (.txt)</button>
                <button id="clearLogBtn" class="danger-button">Clear ALL Entries</button>
            </div>

            <div class="points-reference">
                <div class="reference-section">
                    <h3>⭐ Reference</h3>
                    <div class="points-list-item"><span>Legend:</span><strong>5k</strong></div>
                    <div class="points-list-item"><span>Boost/Donation:</span><strong>1k</strong></div>
                    <div class="points-list-item"><span>Mee6 10/15/20:</span><strong>2/3/4k</strong></div>
                </div>
            </div>
        </div>

        <div class="list-container">
            <h2>📜 Points History</h2> 
            <div style="display:flex; gap:10px; width:100%; margin-bottom:15px;">
                <input type="text" id="searchBar" placeholder="🔍 Search logs..." style="margin:0;">
                <button id="searchButton" style="width:100px;">Search</button>
            </div>
            <ul id="entryList"></ul>
        </div>
    </div>

    <script>
        const BIN_ID = "69389022ae596e708f8e9cb0";
        const SECRET_KEY = "$2a$10$AGsAc/FGcGFFtSHsaLM9de17DA4gr8Tn/A1ZD6B1NkQHITT2Mb21y"; 
        const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;
        const DISCORD_WEBHOOK = "https://discord.com/api/webhooks/1459631306999599229/iupMtQCVAOzQs7bdOshKoj5lKChcB9RHACgJjzDbSe137DUrvzFdfnm2pLpcokiSpKKi?thread_id=1460580121894191186";

        let logEntries = [];

        async function sendToDiscord(e) {
            let colorVal = 2003199; // Blue
            if (e.actionClass === 'added') colorVal = 3066993; // Green
            if (e.actionClass === 'deducted') colorVal = 15158332; // Red

            const log = {
                embeds: [{
                    title: "Sent Points Log",
                    color: colorVal,
                    fields: [
                        { name: "Player", value: e.player, inline: true },
                        { name: "Action", value: e.action, inline: true },
                        { name: "Amount", value: e.amount, inline: true },
                        { name: "Reason", value: e.reason, inline: false },
                        { name: "Staff Note", value: e.note || "N/A", inline: false }
                    ],
                    footer: { text: `Logged: ${new Date().toLocaleString('en-GB')}` },
                    timestamp: new Date()
                }]
            };

            try {
                await fetch(DISCORD_WEBHOOK, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(log) });
                document.getElementById('discordStatus').style.color = "#2ECC71"; document.getElementById('discordStatus').textContent = "✅ Sent to Discord";
            } catch (err) { console.error(err); }
            setTimeout(() => { document.getElementById('discordStatus').textContent = ""; }, 4000);
        }

        async function loadEntries() {
            try {
                const res = await fetch(API_URL, { headers: { 'X-Master-Key': SECRET_KEY } });
                const data = await res.json();
                logEntries = Array.isArray(data.record) ? data.record.filter(e => e && e.player) : [];
                renderEntries();
            } catch (e) { console.error(e); }
        }

        async function saveEntries() {
            try {
                await fetch(API_URL, { method: 'PUT', headers: { 'Content-Type': 'application/json', 'X-Master-Key': SECRET_KEY }, body: JSON.stringify(logEntries.length > 0 ? logEntries : [{text: "PLACEHOLDER"}]) });
            } catch (err) { console.error(err); }
        }

        async function deleteEntry(idx) {
            if (!confirm(`Delete entry?`)) return;
            logEntries.splice(idx, 1); renderEntries(); await saveEntries();
        }

        function renderEntries() {
            const list = document.getElementById('entryList');
            list.innerHTML = '';
            logEntries.slice().reverse().forEach((e, i) => {
                const actualIdx = logEntries.length - 1 - i;
                const li = document.createElement('li');
                li.className = e.actionClass || 'other';
                li.innerHTML = `<button class="delete-btn" onclick="deleteEntry(${actualIdx})">&times;</button>${e.html}`;
                li.setAttribute('data-search', (e.search || '').toLowerCase());
                list.appendChild(li);
            });
        }

        document.getElementById('actionSelect').onchange = () => document.getElementById('otherActionInput').style.display = document.getElementById('actionSelect').value === 'Other Action' ? 'block' : 'none';
        document.getElementById('whatFor').onchange = () => document.getElementById('miscReasonInput').style.display = document.getElementById('whatFor').value === 'Misc' ? 'block' : 'none';

        document.getElementById('addToListBtn').onclick = async function() {
            const nameValue = document.getElementById('nameId').value.trim();
            const amountValue = document.getElementById('amountInput').value.trim();
            const noteValue = document.getElementById('noteInput').value.trim();
            let actionValue = document.getElementById('actionSelect').value;
            let reasonValue = document.getElementById('whatFor').value;

            if (!nameValue || !actionValue || !amountValue || !reasonValue) return alert('Fill all fields!');
            
            if (actionValue === 'Other Action') actionValue = "Other Action: " + document.getElementById('otherActionInput').value.trim();
            if (reasonValue === 'Misc') reasonValue = "Misc: " + document.getElementById('miscReasonInput').value.trim();

            let aClass = 'other';
            if (actionValue.includes('Added')) aClass = 'added';
            else if (actionValue.includes('Deducted')) aClass = 'deducted';
            else if (actionValue.includes('Adjusted') || actionValue.includes('Balance')) aClass = 'adjusted';

            const ts = new Date().toLocaleString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: true });
            
            const htmlValue = `<div class="log-content"><span class="log-segment log-segment-name"><strong>Player:</strong> ${nameValue}</span><span class="log-segment log-segment-action"><strong>Action:</strong> ${actionValue}</span><span class="log-segment log-segment-amount"><strong>Amount:</strong> ${amountValue}</span><span class="log-segment log-segment-reason"><strong>Reason:</strong> ${reasonValue}</span></div>${noteValue ? `<span class="log-segment log-segment-note"><strong>Note:</strong> ${noteValue}</span>` : ''}<span class="log-timestamp">Logged: ${ts}</span>`;
            
            const entry = { player: nameValue, action: actionValue, amount: amountValue, reason: reasonValue, note: noteValue, html: htmlValue, actionClass: aClass, search: `${nameValue} ${actionValue} ${amountValue} ${reasonValue} ${noteValue}`.toLowerCase() };

            logEntries.push(entry); 
            renderEntries(); 
            await saveEntries();
            document.getElementById('discordStatus').textContent = "📡 Syncing..."; 
            await sendToDiscord(entry);
            
            document.getElementById('nameId').value = ''; document.getElementById('amountInput').value = ''; document.getElementById('noteInput').value = '';
            document.getElementById('actionSelect').selectedIndex = 0; document.getElementById('whatFor').selectedIndex = 0;
            document.getElementById('otherActionInput').style.display = 'none'; document.getElementById('miscReasonInput').style.display = 'none';
        };

        document.getElementById('clearLogBtn').onclick = async function() {
            if (prompt("Enter password (legends) to clear logs:") !== "legends") return;
            logEntries = []; renderEntries(); await saveEntries();
        };

        document.getElementById('searchButton').onclick = () => {
            const q = document.getElementById('searchBar').value.toLowerCase();
            Array.from(document.getElementById('entryList').children).forEach(li => {
                li.style.display = li.getAttribute('data-search').includes(q) ? 'flex' : 'none';
            });
        };

        document.addEventListener('DOMContentLoaded', loadEntries);
    </script>
</body>
</html>
